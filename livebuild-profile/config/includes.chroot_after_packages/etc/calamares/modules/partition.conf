# Restringe el desplegable de sistema de archivos a lo que realmente
# tiene herramienta de formateo instalada en el ISO (verificado: e2fsprogs
# y btrfs-progs sí están, xfsprogs/f2fs-tools/jfsutils no) — evita que
# alguien elija XFS/F2FS/JFS en el instalador y el formateo falle porque
# no existe mkfs.xfs / mkfs.f2fs / mkfs.jfs en el entorno live.
---
availableFileSystemTypes:
    - ext4
    - btrfs

defaultFileSystemType: ext4

# Swap chico como colchón: zram (ver zram-tools) ya cubre el swap normal
# de uso diario, esto es solo para no quedarse sin memoria del todo en un
# apretón extremo. No incluye "suspend" porque no queremos que Calamares
# reserve una partición del tamaño de la RAM por defecto.
userSwapChoices:
    - none
    - small

initialSwapChoice: small

# / y /home separados: si el sistema se rompe o hay que reinstalar, los
# archivos del usuario (fotos, documentos, proyectos) sobreviven sin
# backup manual — importante para el público de OweeLinux (chicos/oficina
# que no van a hacer backups por su cuenta). root fijo en 40GiB (con
# mínimo 15GiB en discos chicos) para que quepa el stack de dev completo
# (Rust/Go/Podman/Ollama pueden pesar varios GB); /home se queda con el
# resto del disco.
#
# Nota: a diferencia de availableFileSystemTypes (verificado contra el
# binario de Calamares), esta sección de partitionLayout/swap no se pudo
# contrastar contra un ejemplo real local — probar en la instalación de
# prueba que efectivamente aparezcan root+home separados y el swap chico.
partitionLayout:
    - name: root
      filesystem: ext4
      mountPoint: "/"
      size: 40GiB
      minSize: 15GiB
    - name: home
      filesystem: ext4
      mountPoint: "/home"
      size: 100%
