<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Cifras en Owee Script en todo el sistema (calculadora, reloj, calendario...).
     "Owee Numerals" solo contiene las cifras 0-9; el resto del texto sigue con la fuente normal.
     Para volver a cifras normales: quita este archivo (o desinstala el paquete owee-numerals) y ejecuta fc-cache -f. -->
<fontconfig>
  <match target="pattern">
    <edit name="family" mode="prepend" binding="strong"><string>Owee Numerals</string></edit>
  </match>
</fontconfig>
