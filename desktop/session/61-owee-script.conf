<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Owee Script usa la zona privada U+E000–E049. OpenSymbol (de LibreOffice) también la usa para sus símbolos y ganaba el reemplazo de fuentes: la interfaz en Owee Script salía como dibujos sueltos.
     Owee Sans va primero para esos caracteres (no tiene letras latinas, así que el resto del texto no cambia). -->
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>Owee Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Owee Sans</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Owee Sans</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Owee Sans</family></prefer></alias>
</fontconfig>
