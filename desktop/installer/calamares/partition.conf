# Disco completo (UEFI): EFI de 512 MB + raíz ext4 con el resto. El gestor de arranque lo instala owee-install-deploy (GRUB estándar por UEFI), no el módulo bootloader.
---
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M
efiSystemPartitionName: EFI
userSwapChoices: [ none ]
initialPartitioningChoice: erase
initialSwapChoice: none
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: false
defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4" ]
partitionLayout:
  - name: "oweeroot"
    filesystem: "ext4"
    mountPoint: "/"
    size: 100%
