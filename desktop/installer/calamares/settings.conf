# Calamares de OweeLinux: el sistema es una imagen ostree, así que no se descomprime ningún archivo (sin unpackfs): Calamares particiona, formatea y monta el disco,
# y el módulo shellprocess «oweedeploy» copia y despliega la versión de este sistema (owee-install-deploy). El usuario, el idioma y el teclado se piden en el PRIMER ARRANQUE
# (desktop/setup/owee_setup.py), así que aquí no hay módulos de usuarios, idioma ni teclado: instalar son cuatro pantallas.
---
modules-search: [ local ]
instances:
- id: oweedeploy
  module: shellprocess
  config: shellprocess-oweedeploy.conf
sequence:
- show: [ welcome, partition, summary ]
- exec: [ partition, mount, shellprocess@oweedeploy, umount ]
- show: [ finished ]
branding: oweelinux
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
