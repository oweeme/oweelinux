<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <title>OweeLinux Koi Dawn</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6d9c9"/>
      <stop offset="0.4" stop-color="#e3a98f"/>
      <stop offset="0.65" stop-color="#5f7d78"/>
      <stop offset="1" stop-color="#122019"/>
    </linearGradient>
    <clipPath id="kdS1"><ellipse cx="150" cy="0" rx="150" ry="45"/></clipPath>
    <clipPath id="kdS2"><ellipse cx="150" cy="0" rx="150" ry="45"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="url(#bg)"/>

  <g fill="none" stroke="#fbeadd" stroke-width="3" stroke-linecap="round" opacity="0.25">
    <path d="M -100,620 C 300,590 520,650 900,620 C 1300,580 1500,650 2020,620"/>
    <path d="M -100,800 C 350,770 560,830 960,800 C 1360,760 1560,830 2020,800"/>
  </g>

  <!-- lotus cluster, upper left -->
  <g transform="translate(240,180)">
    <ellipse cx="-50" cy="55" rx="75" ry="24" fill="#5f7d78" opacity="0.5"/>
    <ellipse cx="60" cy="80" rx="55" ry="18" fill="#4a6560" opacity="0.5"/>
    <g fill="#fbeadd" opacity="0.95">
      <ellipse cx="0" cy="-30" rx="14" ry="30"/>
      <ellipse cx="26" cy="-15" rx="14" ry="30" transform="rotate(60 26 -15)"/>
      <ellipse cx="26" cy="15" rx="14" ry="30" transform="rotate(120 26 15)"/>
      <ellipse cx="0" cy="30" rx="14" ry="30" transform="rotate(180 0 30)"/>
      <ellipse cx="-26" cy="15" rx="14" ry="30" transform="rotate(240 -26 15)"/>
      <ellipse cx="-26" cy="-15" rx="14" ry="30" transform="rotate(300 -26 -15)"/>
    </g>
    <circle cx="0" cy="0" r="11" fill="#f06548"/>
  </g>

  <!-- koi 1: cream + coral, large -->
  <g transform="translate(1180,650) rotate(-10) scale(2.1)">
    <path d="M 280,-10 C 340,-40 380,-70 400,-90 C 370,-40 360,-10 350,0 C 360,10 370,40 400,90 C 380,70 340,40 280,10 Z" fill="#f06548" opacity="0.85"/>
    <path d="M 100,-40 Q 140,-92 182,-40 Q 140,-52 100,-40 Z" fill="#f06548" opacity="0.85"/>
    <path d="M 55,28 Q 88,72 132,34 Q 92,44 55,28 Z" fill="#f06548" opacity="0.75"/>
    <ellipse cx="150" cy="0" rx="150" ry="45" fill="#fff6ec"/>
    <g clip-path="url(#kdS1)">
      <ellipse cx="95" cy="-8" rx="48" ry="24" fill="#f06548" opacity="0.92" transform="rotate(-14 95 -8)"/>
      <ellipse cx="195" cy="12" rx="38" ry="19" fill="#f06548" opacity="0.92" transform="rotate(10 195 12)"/>
      <ellipse cx="55" cy="14" rx="20" ry="12" fill="#241a12" opacity="0.85"/>
    </g>
    <path d="M 8,6 Q -14,14 -22,26" stroke="#241a12" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 8,-4 Q -14,-14 -24,-22" stroke="#241a12" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <circle cx="28" cy="-10" r="6.5" fill="#181818"/>
    <circle cx="26" cy="-12.5" r="2" fill="#f4f4f4"/>
  </g>

  <!-- koi 2: coral, following behind -->
  <g transform="translate(1480,830) rotate(-6) scale(1.3)">
    <path d="M 280,-10 C 340,-40 380,-70 400,-90 C 370,-40 360,-10 350,0 C 360,10 370,40 400,90 C 380,70 340,40 280,10 Z" fill="#c9542f" opacity="0.9"/>
    <ellipse cx="150" cy="0" rx="150" ry="45" fill="#e2703f"/>
    <g clip-path="url(#kdS2)">
      <ellipse cx="110" cy="-6" rx="26" ry="15" fill="#fff6ec" opacity="0.85" transform="rotate(-10 110 -6)"/>
    </g>
    <circle cx="28" cy="-10" r="6" fill="#241a12"/>
    <circle cx="26" cy="-12" r="1.8" fill="#fff6ec"/>
  </g>
</svg>
